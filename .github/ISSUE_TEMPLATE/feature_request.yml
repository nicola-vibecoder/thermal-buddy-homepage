name: Feature Request / 機能要望
description: Suggest a new idea or improvement / 新機能の提案や改善の要望
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We would love to hear your ideas for Thermal Buddy!
        Thermal Buddy への新しいアイデアをお聞かせください！
  - type: textarea
    id: goal
    attributes:
      label: Goal / 解決したい課題
      description: What problem are you trying to solve? / どのような課題を解決したいですか？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 提案内容
      description: How would you like the feature to work? / どのような機能が欲しいですか？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered / 代替案
      description: Any other ways you've thought of to solve this. / 他に検討した方法はありますか？
  - type: textarea
    id: additional
    attributes:
      label: Additional Context / その他
      description: Any other info. / その他の情報があれば入力してください。
