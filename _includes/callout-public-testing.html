{% assign on_jp = false %}

{% endif %}
<div class="support-callout support-callout--live" role="status">

    🎉 <a href="/jp/testflight" class="support-callout__link">TestFlight でベータ版を公開中</a> — 今すぐ参加できます
  </p>
  {% else %}
  <p class="support-callout__text">
    🎉 <a href="/testflight" class="support-callout__link">Beta now available on TestFlight</a> — join today
  </p>
  {% endif %}
</div>
